<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
</head>
<body>

    <h1>Weather App</h1>

    <div>
        <input
            id="location"
            type="text"
            placeholder="Enter a city, postcode, country, or coordinates"
        >
        <button id="search-button">Search</button>
    </div>

    <p id="error-message"></p>

    <section id="hourly-forecast">
        <h2>Hourly Forecast</h2>
        <div id="hourly-forecast-container"></div>
    </section>

    <section id="daily-forecast">
        <h2>Daily Forecast</h2>
        <div id="daily-forecast-container"></div>
    </section>

    <script src="/static/js/weatherUtils.js"></script>
    <script src="/static/js/script.js"></script>
</body>
</html>
